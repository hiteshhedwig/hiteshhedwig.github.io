<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hitesh.one · admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">✎</div>
        <div>
          <div class="brand-title">hitesh.one</div>
          <div class="brand-sub">content studio</div>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-group-title">Write</div>
        <button class="nav-item" data-view="list" data-type="blog">
          <span class="nav-icon">✍</span> Blog posts
        </button>
        <button class="nav-item" data-view="list" data-type="projects">
          <span class="nav-icon">▢</span> Projects
        </button>
        <button class="nav-item" data-view="list" data-type="videos">
          <span class="nav-icon">▶</span> Videos
        </button>
        <button class="nav-item" data-view="list" data-type="bookmarks">
          <span class="nav-icon">☆</span> Bookmarks
        </button>

        <div class="nav-group-title">Site</div>
        <button class="nav-item" data-view="site" data-file="about.md">
          <span class="nav-icon">◉</span> About & bio
        </button>
        <button class="nav-item" data-view="site" data-file="config.md">
          <span class="nav-icon">⚙</span> Sidebar & config
        </button>

        <div class="nav-group-title">Publish</div>
        <button class="nav-item" data-view="git">
          <span class="nav-icon">↑</span> Push to GitHub
        </button>
      </nav>

      <div class="sidebar-footer">
        <a href="http://localhost:4321" target="_blank">→ view site</a>
      </div>
    </aside>

    <main id="main" class="main"></main>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
