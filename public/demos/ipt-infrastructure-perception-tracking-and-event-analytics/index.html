<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Infrastructure 3D Tracking Viewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap');

  :root {
    --cream:        #faf7f2;
    --cream-dark:   #f0ebe3;
    --warm-white:   #fefcf9;
    --paper:        #f5f0e8;
    --ink:          #2c2418;
    --ink-light:    #5c5347;
    --ink-lighter:  #8a7f72;
    --accent:       #c45d3e;
    --accent-light: #e8a490;
    --sage:         #7a8f6e;
    --sage-light:   #d4dece;
    --sky:          #5b7fa5;
    --sky-light:    #c4d5e6;
    --border:       #e0d8cc;
    --border-dark:  #c8bfb0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', Segoe UI, sans-serif;
  }

  .topbar {
    padding: 0 20px;
    height: 54px;
    background: rgba(254,252,249,0.85);
    display: flex;
    gap: 12px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(8px);
  }

  .topbar::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 42%);
  }

  .topbar b {
    font-family: 'Lora', Georgia, serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.1px;
    white-space: nowrap;
    margin-right: 6px;
  }

  .topbar span:not(.status) {
    font-size: 10px;
    color: var(--ink-lighter);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.7px;
  }

  select {
    background: var(--cream);
    color: var(--ink);
    border: 1px solid var(--border-dark);
    padding: 5px 8px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  select:focus, select:hover { border-color: var(--accent); }

  button {
    background: var(--ink);
    color: var(--cream);
    border: none;
    padding: 6px 18px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.2px;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    min-width: 72px;
  }

  button:hover {
    background: var(--ink-light);
    box-shadow: 0 2px 10px rgba(44,36,24,0.18);
    transform: translateY(-1px);
  }

  button:active { transform: translateY(0); box-shadow: none; }

  input[type=range] {
    accent-color: var(--accent);
    cursor: pointer;
  }

  label {
    font-size: 12px;
    color: var(--ink-lighter);
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
    font-weight: 500;
    transition: color 0.15s;
  }

  label:hover { color: var(--ink); }
  label input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }

  .layout {
    display: grid;
    grid-template-columns: 47vw 53vw;
    height: calc(100vh - 54px);
  }

  .left {
    padding: 10px;
    border-right: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .right {
    padding: 10px;
    overflow: hidden;
  }

  #bevCanvas {
    width: 100%;
    flex: 1;
    min-height: 0;
    background: #060d06;
    border: 1px solid var(--border-dark);
    border-radius: 12px;
    display: block;
  }

  .details {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    height: 118px;
    overflow: auto;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.75;
    color: var(--ink-light);
    flex-shrink: 0;
  }

  .details b { color: var(--accent); font-weight: 500; }
  .details hr { border: none; border-top: 1px solid var(--border); margin: 5px 0; }

  .camGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    height: calc(100vh - 74px);
  }

  .camWrap {
    position: relative;
    background: #07080a;
    border: 1px solid var(--border-dark);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  /* Each camera panel — distinct top-stripe colour */
  .camWrap:nth-child(1) { border-top: 3px solid var(--sky); }
  .camWrap:nth-child(2) { border-top: 3px solid var(--sage); }
  .camWrap:nth-child(3) { border-top: 3px solid var(--accent); }
  .camWrap:nth-child(4) { border-top: 3px solid #a07850; }

  .camWrap:nth-child(1):hover { border-color: var(--sky);    box-shadow: 0 2px 16px rgba(91,127,165,0.22); }
  .camWrap:nth-child(2):hover { border-color: var(--sage);   box-shadow: 0 2px 16px rgba(122,143,110,0.22); }
  .camWrap:nth-child(3):hover { border-color: var(--accent); box-shadow: 0 2px 16px rgba(196,93,62,0.22); }
  .camWrap:nth-child(4):hover { border-color: #a07850;       box-shadow: 0 2px 16px rgba(160,120,80,0.22); }

  .camWrap canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .status {
    color: var(--ink-lighter);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
  }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--cream); }
  ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>
<div id="__dataLoader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#faf7f2;font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:#8a7f72;letter-spacing:0.06em;z-index:9999;">loading demo data…</div>
<div class="topbar">
  <b>Infrastructure 3D Tracking Viewer</b>
  <span>Track:</span>
  <select id="trackSelect"></select>
  <button id="playBtn">Play</button>
  <select id="speedSelect" title="Playback speed">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
  </select>
  <span>Frame:</span>
  <input id="frameSlider" type="range" min="0" max="0" value="0" style="width: 330px;">
  <span id="frameLabel" class="status"></span>
  <label><input type="checkbox" id="showCameraBoxes" checked> camera boxes</label>
  <label><input type="checkbox" id="showTrails" checked> trails</label>
  <label><input type="checkbox" id="showPointCloud" checked> point cloud</label>
  <label><input type="checkbox" id="showGrid" checked> grid</label>
</div>

<div class="layout">
  <div class="left">
    <canvas id="bevCanvas" width="900" height="900"></canvas>
    <div class="details" id="details"></div>
  </div>
  <div class="right">
    <div class="camGrid">
      <div class="camWrap"><canvas id="cam_infra_0" width="640" height="360"></canvas></div>
      <div class="camWrap"><canvas id="cam_infra_1" width="640" height="360"></canvas></div>
      <div class="camWrap"><canvas id="cam_infra_2" width="640" height="360"></canvas></div>
      <div class="camWrap"><canvas id="cam_vehicle_0" width="640" height="360"></canvas></div>
    </div>
  </div>
</div>

<script>
(async function __boot() {
  const __loadEl = document.getElementById("__dataLoader");
  let DATA;
  try {
    DATA = await fetch("data.json").then(r => r.json());
  } catch(e) {
    if (__loadEl) __loadEl.textContent = "failed to load demo data";
    console.error("Failed to load data.json", e);
    return;
  }
  if (__loadEl) __loadEl.remove();

  // ── main viewer block ──
const BOX_EDGES = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];

let current = 0;
let playing = false;
let timer = null;
let imgCache = {};
let imgWaiters = {};
let renderSerial = 0;

const trackSelect = document.getElementById("trackSelect");
const playBtn = document.getElementById("playBtn");
const frameSlider = document.getElementById("frameSlider");
const frameLabel = document.getElementById("frameLabel");
const details = document.getElementById("details");

const CLASS_COLORS = {
  PEDESTRIAN: '#e07a52',
  CAR:        '#4d94d4',
  TRUCK:      '#6ea86e',
  VAN:        '#5bb8b0',
  BUS:        '#d4a030',
  MOTORCYCLE: '#9b7fc0',
  BICYCLE:    '#5bbfb0',
  CYCLIST:    '#5bbfb0',
};
function colorForClass(cls) {
  return CLASS_COLORS[String(cls || '').toUpperCase()] || '#8a9898';
}
function classForTrack(tid) {
  for (const f of DATA.frames) {
    const t = f.tracks.find(t => String(t.track_id) === String(tid));
    if (t) return t.class_name;
  }
  return null;
}

function loadImage(path, cb) {
  const cached = imgCache[path];

  if (cached && cached.complete && cached.naturalWidth > 0) {
    cb(cached);
    return;
  }

  if (cached) {
    if (!imgWaiters[path]) imgWaiters[path] = [];
    imgWaiters[path].push(cb);
    return;
  }

  const img = new Image();
  imgCache[path] = img;
  imgWaiters[path] = [cb];

  img.onload = () => {
    const waiters = imgWaiters[path] || [];
    delete imgWaiters[path];
    waiters.forEach(fn => fn(img));
  };

  img.onerror = () => {
    console.warn("Failed to load image:", path);
    delete imgWaiters[path];
  };

  img.src = path;
}

function selectedTrack() {
  return trackSelect.value;
}

function visibleFramesForSelectedTrack() {
  const tid = selectedTrack();
  if (tid === "ALL") return DATA.frames.map((_, i) => i);
  const out = [];
  DATA.frames.forEach((f, i) => {
    if (f.tracks.some(t => String(t.track_id) === tid)) out.push(i);
  });
  return out;
}

function setupControls() {
  trackSelect.innerHTML = "";
  const allOpt = document.createElement("option");
  allOpt.value = "ALL";
  allOpt.textContent = "ALL TRACKS";
  trackSelect.appendChild(allOpt);

  Object.keys(DATA.tracks).sort((a,b)=>Number(a)-Number(b)).forEach(tid => {
    const t = DATA.tracks[tid];
    const opt = document.createElement("option");
    opt.value = tid;
    opt.textContent = `T${tid} | ${t.class_name} | ${t.num_frames} frames | max ${t.max_speed_mps.toFixed(1)} m/s`;
    trackSelect.appendChild(opt);
  });

  frameSlider.max = DATA.frames.length - 1;
  frameSlider.value = current;

  trackSelect.onchange = () => {
    const visible = visibleFramesForSelectedTrack();
    if (selectedTrack() !== "ALL" && visible.length) current = visible[0];
    frameSlider.value = current;
    render();
  };

  frameSlider.oninput = () => {
    current = Number(frameSlider.value);
    render();
  };

  playBtn.onclick = () => togglePlay();
  document.getElementById("speedSelect").onchange = () => { if (playing) { clearInterval(timer); timer = setInterval(playStep, playInterval()); } };

  document.getElementById("showCameraBoxes").onchange = render;
  document.getElementById("showTrails").onchange = render;
  document.getElementById("showPointCloud").onchange = render;
  document.getElementById("showGrid").onchange = render;
}

function playInterval() {
  const s = document.getElementById("speedSelect");
  return s ? Math.round(100 / parseFloat(s.value)) : 100;
}

function advanceFrame() {
  const visible = visibleFramesForSelectedTrack();
  if (!visible.length) return;
  if (selectedTrack() === "ALL") {
    current = (current + 1) % DATA.frames.length;
  } else {
    let pos = visible.indexOf(current);
    if (pos < 0) pos = 0;
    else pos = (pos + 1) % visible.length;
    current = visible[pos];
  }
  frameSlider.value = current;
}

function togglePlay() {
  playing = !playing;
  playBtn.textContent = playing ? "Pause" : "Play";
  if (!playing) return;

  const interval = playInterval();
  (async function playLoop() {
    while (playing) {
      const t0 = Date.now();
      advanceFrame();
      const frame = DATA.frames[current];
      await new Promise(resolve => loadImage(frame.bev_image, resolve));
      render();
      const elapsed = Date.now() - t0;
      if (playing) await new Promise(r => setTimeout(r, Math.max(0, interval - elapsed)));
    }
  })();
}

function worldToBev(x, y, canvas) {
  const [xmin, xmax] = DATA.bev.xlim;
  const [ymin, ymax] = DATA.bev.ylim;
  const px = (x - xmin) / (xmax - xmin) * canvas.width;
  const py = canvas.height - (y - ymin) / (ymax - ymin) * canvas.height;
  return [px, py];
}

function bevBoxCorners(t) {
  const c = Math.cos(t.yaw);
  const s = Math.sin(t.yaw);
  const l2 = t.l / 2;
  const w2 = t.w / 2;

  const local = [
    [ l2,  w2],
    [ l2, -w2],
    [-l2, -w2],
    [-l2,  w2],
  ];

  return local.map(([lx, ly]) => {
    return [
      t.x + c * lx - s * ly,
      t.y + s * lx + c * ly,
    ];
  });
}

function drawGridLines(ctx, canvas) {
  ctx.strokeStyle = "rgba(80,110,80,0.45)";
  ctx.lineWidth = 1;
  const step = 10;

  const [xmin, xmax] = DATA.bev.xlim;
  const [ymin, ymax] = DATA.bev.ylim;

  for (let x = Math.ceil(xmin / step) * step; x <= xmax; x += step) {
    const [px, _] = worldToBev(x, ymin, canvas);
    ctx.beginPath();
    ctx.moveTo(px, 0);
    ctx.lineTo(px, canvas.height);
    ctx.stroke();
  }

  for (let y = Math.ceil(ymin / step) * step; y <= ymax; y += step) {
    const [_, py] = worldToBev(xmin, y, canvas);
    ctx.beginPath();
    ctx.moveTo(0, py);
    ctx.lineTo(canvas.width, py);
    ctx.stroke();
  }
}

function drawBevTitle(ctx) {
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, 390, 42);
  ctx.fillStyle = "#ddd";
  ctx.font = "20px Arial";
  ctx.fillText("BEV Tracking View | x→ right, y↑ up", 18, 30);
}

function drawGrid(ctx, canvas) {
  ctx.fillStyle = "#081008";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (document.getElementById("showGrid").checked) {
    drawGridLines(ctx, canvas);
  }
  drawBevTitle(ctx);
}

function drawTrackBEV(ctx, canvas, t, strong=false) {
  const color = colorForClass(t.class_name);
  const corners = bevBoxCorners(t).map(([x,y]) => worldToBev(x, y, canvas));

  ctx.strokeStyle = strong ? "#ffff00" : color;
  ctx.lineWidth = strong ? 5 : 3;
  ctx.beginPath();
  corners.forEach(([px, py], i) => {
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  });
  ctx.closePath();
  ctx.stroke();

  const [cx, cy] = worldToBev(t.x, t.y, canvas);

  ctx.fillStyle = strong ? "#ffff00" : color;
  ctx.font = strong ? "bold 22px Arial" : "bold 18px Arial";
  ctx.fillText(`T${t.track_id} ${t.class_name} ${t.speed_mps.toFixed(1)}m/s`, cx + 6, cy - 6);

  // Future motion dots.
  const speed = Math.hypot(t.vx, t.vy);
  if (speed > 0.25) {
    [0.4, 0.8, 1.2].forEach((dt, i) => {
      const [px, py] = worldToBev(t.x + t.vx * dt, t.y + t.vy * dt, canvas);
      ctx.beginPath();
      ctx.arc(px, py, 6 - i, 0, Math.PI * 2);
      ctx.fill();
    });
  }
}

function drawTrail(ctx, canvas, tid) {
  if (!document.getElementById("showTrails").checked) return;

  const pts = [];
  for (let i = 0; i <= current; i++) {
    const tr = DATA.frames[i].tracks.find(t => String(t.track_id) === String(tid));
    if (tr) pts.push(worldToBev(tr.x, tr.y, canvas));
  }

  if (pts.length < 2) return;

  ctx.strokeStyle = colorForClass(classForTrack(tid));
  ctx.lineWidth = 3;
  ctx.beginPath();
  pts.forEach(([px, py], i) => {
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  });
  ctx.stroke();
}

function drawBEVOverlay(ctx, canvas, frame, tid) {
  if (document.getElementById("showGrid").checked) {
    drawGridLines(ctx, canvas);
  }
  drawBevTitle(ctx);

  if (tid === "ALL") {
    frame.tracks.forEach(t => drawTrackBEV(ctx, canvas, t, false));
  } else {
    drawTrail(ctx, canvas, tid);
    const t = frame.tracks.find(x => String(x.track_id) === tid);
    if (t) drawTrackBEV(ctx, canvas, t, true);
  }
}

function drawBEV() {
  const canvas = document.getElementById("bevCanvas");
  const ctx = canvas.getContext("2d");
  const frame = DATA.frames[current];
  const tid = selectedTrack();

  const usePointCloud = document.getElementById("showPointCloud").checked && frame.bev_image;

  if (usePointCloud) {
    loadImage(frame.bev_image, (img) => {
      ctx.fillStyle = "#081008";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      drawBEVOverlay(ctx, canvas, frame, tid);
    });
  } else {
    drawGrid(ctx, canvas);
    if (tid === "ALL") {
      frame.tracks.forEach(t => drawTrackBEV(ctx, canvas, t, false));
    } else {
      drawTrail(ctx, canvas, tid);
      const t = frame.tracks.find(x => String(x.track_id) === tid);
      if (t) drawTrackBEV(ctx, canvas, t, true);
    }
  }
}

function drawCameraCanvas(camKey, serial) {
  const canvas = document.getElementById(`cam_${camKey}`);
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  const frame = DATA.frames[current];
  const frameAtRequest = current;

  const imagePath = frame.camera_images[camKey];

  if (!imagePath) {
    ctx.fillStyle = "#111";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#aaa";
    ctx.font = "22px Arial";
    ctx.fillText(`${camKey}: no image`, 30, 50);
    return;
  }

  loadImage(imagePath, (img) => {
    // Critical anti-flicker guard:
    // ignore stale async image callbacks from older frames.
    if (serial !== renderSerial || frameAtRequest !== current) return;

    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(0,0,canvas.width,32);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px Arial";
    ctx.fillText(camKey, 12, 22);

    if (!document.getElementById("showCameraBoxes").checked) return;

    const tid = selectedTrack();
    let tracks = frame.tracks;
    if (tid !== "ALL") tracks = tracks.filter(t => String(t.track_id) === tid);

    tracks.forEach(t => {
      const proj = t.camera_boxes[camKey];
      if (!proj) return;

      const color = tid === "ALL" ? colorForClass(t.class_name) : "#ffff00";
      const pts = proj.corners;
      const valid = proj.valid;

      BOX_EDGES.forEach(([a,b]) => {
        if (!valid[a] || !valid[b]) return;

        ctx.strokeStyle = "black";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(pts[a][0], pts[a][1]);
        ctx.lineTo(pts[b][0], pts[b][1]);
        ctx.stroke();

        ctx.strokeStyle = color;
        ctx.lineWidth = tid === "ALL" ? 3 : 4;
        ctx.beginPath();
        ctx.moveTo(pts[a][0], pts[a][1]);
        ctx.lineTo(pts[b][0], pts[b][1]);
        ctx.stroke();
      });

      const label = `T${t.track_id}`;
      const cx = pts.reduce((s,p)=>s+p[0],0) / pts.length;
      const cy = pts.reduce((s,p)=>s+p[1],0) / pts.length;

      ctx.font = "bold 24px Arial";
      ctx.lineWidth = 6;
      ctx.strokeStyle = "black";
      ctx.strokeText(label, cx + 6, cy - 6);
      ctx.fillStyle = "white";
      ctx.fillText(label, cx + 6, cy - 6);
    });
  });
}

function updateDetails() {
  const frame = DATA.frames[current];
  const tid = selectedTrack();

  frameLabel.textContent = `${current+1}/${DATA.frames.length} | sample ${frame.frame_idx} | ${frame.frame_id}`;

  if (tid === "ALL") {
    details.innerHTML = `
      <b>Frame:</b> ${frame.frame_idx}<br>
      <b>Frame ID:</b> ${frame.frame_id}<br>
      <b>Tracks in frame:</b> ${frame.tracks.length}<br>
      <b>Tip:</b> select a track to isolate it in BEV and camera panels.
    `;
    return;
  }

  const summary = DATA.tracks[tid];
  const t = frame.tracks.find(x => String(x.track_id) === tid);

  details.innerHTML = `
    <b>Selected:</b> T${tid}<br>
    <b>Class:</b> ${summary.class_name}<br>
    <b>Frame range:</b> ${summary.start_frame} → ${summary.end_frame}<br>
    <b>Visible frames:</b> ${summary.num_frames}<br>
    <b>Max speed:</b> ${summary.max_speed_mps.toFixed(2)} m/s<br>
    <b>Avg score:</b> ${summary.avg_score.toFixed(3)}<br>
    <hr>
    ${t ? `
      <b>Current frame:</b> ${frame.frame_idx}<br>
      <b>Current speed:</b> ${t.speed_mps.toFixed(2)} m/s<br>
      <b>Score:</b> ${t.score.toFixed(3)}<br>
      <b>Position:</b> x=${t.x.toFixed(2)}, y=${t.y.toFixed(2)}
    ` : `<b>Track not present in this frame.</b>`}
  `;
}

function prefetchAhead(n) {
  for (let i = 1; i <= n; i++) {
    const f = DATA.frames[current + i];
    if (!f) break;
    loadImage(f.bev_image, () => {});
    Object.values(f.camera_images || {}).forEach(p => loadImage(p, () => {}));
  }
}

function render() {
  renderSerial += 1;
  const serial = renderSerial;

  drawBEV();

      }

      // Main label.
      ctx.font = "bold 22px Arial";
      const label = `${ep.severity} CROSSING GROUP RISK | VEH T${ep.vehicle_track_id} | GROUP ${ep.group_track_ids.length} VRUs`;
      ctx.lineWidth = 7;
      ctx.strokeStyle = "black";
      ctx.strokeText(label, 22, 72);
      ctx.fillStyle = color;
      ctx.fillText(label, 22, 72);

      ctx.restore();
    });
  }

  const prevDrawBEVOverlayGroup = drawBEVOverlay;
  drawBEVOverlay = function(ctx, canvas, frame, tid) {
    prevDrawBEVOverlayGroup(ctx, canvas, frame, tid);
    drawGroupCrossingBEV(ctx, canvas, frame);
  };

  function camValidPts(track, camKey) {
    if (!track || !track.camera_boxes || !track.camera_boxes[camKey]) return [];

    const proj = track.camera_boxes[camKey];
    const pts = proj.corners || [];
    const valid = proj.valid || [];
    const out = [];

    for (let i = 0; i < pts.length; i++) {
      if (valid[i]) out.push([Number(pts[i][0]), Number(pts[i][1])]);
    }

    return out;
  }

  function camProjectedCenter(track, camKey) {
    const pts = camValidPts(track, camKey);
    if (!pts.length) return null;

    return [
      mean(pts.map(p => p[0])),
      mean(pts.map(p => p[1]))
    ];
  }

  function drawCamera3DHighlight(ctx, track, camKey, color, label) {
    if (!track || !track.camera_boxes || !track.camera_boxes[camKey]) return false;

    const proj = track.camera_boxes[camKey];
    const pts = proj.corners || [];
    const valid = proj.valid || [];
    const edges = (typeof BOX_EDGES !== "undefined") ? BOX_EDGES : GROUP_BOX_EDGES;

    let drew = false;

    edges.forEach(([a,b]) => {
      if (!valid[a] || !valid[b]) return;

      ctx.strokeStyle = "black";
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(pts[a][0], pts[a][1]);
      ctx.lineTo(pts[b][0], pts[b][1]);
      ctx.stroke();

      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(pts[a][0], pts[a][1]);
      ctx.lineTo(pts[b][0], pts[b][1]);
      ctx.stroke();

      drew = true;
    });

    const c = camProjectedCenter(track, camKey);
    if (c) {
      ctx.font = "bold 24px Arial";
      ctx.lineWidth = 7;
      ctx.strokeStyle = "black";
      ctx.strokeText(label, c[0] + 8, c[1] - 10);
      ctx.fillStyle = color;
      ctx.fillText(label, c[0] + 8, c[1] - 10);
    }

    return drew;
  }

  function drawGroupCrossingCameraOverlay(camKey) {
    const canvas = document.getElementById(`cam_${camKey}`);
    if (!canvas) return;

    const ctx = canvas.getContext("2d");
    const frame = DATA.frames[current];

    const episodes = getFrameGroupEpisodes(frame).filter(groupEpisodeMatchesSelected);
    if (!episodes.length) return;

    episodes.forEach(ep => {
      const color = groupRiskColor(ep.severity);
      const groupTracks = tracksForGroup(frame, ep);
      const veh = vehicleForEpisode(frame, ep);

      const visibleTracks = [];
      groupTracks.forEach(t => {
        if (camValidPts(t, camKey).length) visibleTracks.push(t);
      });
      if (veh && camValidPts(veh, camKey).length) visibleTracks.push(veh);

      if (!visibleTracks.length) return;

      const allPts = [];
      visibleTracks.forEach(t => allPts.push(...camValidPts(t, camKey)));

      if (allPts.length >= 2) {
        const xs = allPts.map(p => p[0]);
        const ys = allPts.map(p => p[1]);

        const xmin = Math.max(0, Math.min(...xs) - 22);
        const ymin = Math.max(0, Math.min(...ys) - 44);
        const xmax = Math.min(canvas.width, Math.max(...xs) + 22);
        const ymax = Math.min(canvas.height, Math.max(...ys) + 22);

        const w = xmax - xmin;
        const h = ymax - ymin;

        if (w > 5 && h > 5) {
          ctx.fillStyle = ep.severity === "HIGH" ? "rgba(255,0,0,0.12)" : "rgba(255,220,0,0.12)";
          ctx.fillRect(xmin, ymin, w, h);

          ctx.strokeStyle = "black";
          ctx.lineWidth = 9;
          ctx.strokeRect(xmin, ymin, w, h);

          ctx.strokeStyle = color;
          ctx.lineWidth = 5;
          ctx.setLineDash([12, 8]);
          ctx.strokeRect(xmin, ymin, w, h);
          ctx.setLineDash([]);

          const label = `${ep.severity} CROSSING GROUP RISK`;
          ctx.font = "bold 24px Arial";
          ctx.lineWidth = 7;
          ctx.strokeStyle = "black";
          ctx.strokeText(label, xmin + 8, Math.max(28, ymin - 10));
          ctx.fillStyle = color;
          ctx.fillText(label, xmin + 8, Math.max(28, ymin - 10));
        }
      }

      groupTracks.forEach(t => {
        drawCamera3DHighlight(ctx, t, camKey, "#00e5ff", `GROUP P${t.track_id}`);
      });

      if (veh) {
        drawCamera3DHighlight(ctx, veh, camKey, color, `RISK VEH T${veh.track_id}`);
      }

      const vehC = camProjectedCenter(veh, camKey);
      const groupCenters = groupTracks.map(t => camProjectedCenter(t, camKey)).filter(Boolean);

      if (vehC && groupCenters.length) {
        const gx = mean(groupCenters.map(p => p[0]));
        const gy = mean(groupCenters.map(p => p[1]));

        ctx.strokeStyle = "black";
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(vehC[0], vehC[1]);
        ctx.lineTo(gx, gy);
        ctx.stroke();

        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.setLineDash([10, 7]);
        ctx.beginPath();
        ctx.moveTo(vehC[0], vehC[1]);
        ctx.lineTo(gx, gy);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    });
  }

  const prevRenderGroupCrossing = render;
  render = function() {
    prevRenderGroupCrossing();

    // Camera drawing is async. Draw overlay several times so it lands after image load.
    ["infra_0", "infra_1", "infra_2", "vehicle_0"].forEach(cam => {
      setTimeout(() => drawGroupCrossingCameraOverlay(cam), 40);
      setTimeout(() => drawGroupCrossingCameraOverlay(cam), 140);
      setTimeout(() => drawGroupCrossingCameraOverlay(cam), 300);
    });

    updateGroupCrossingPanel();
  };

  function jumpToGroupEpisode(epId) {
    const ep = GROUP_EP_BY_ID[epId];
    if (!ep) return;

    const idx = DATA.frames.findIndex(f => Number(f.frame_idx) === Number(ep.start_frame_idx));
    if (idx < 0) return;

    current = idx;
    const slider = document.getElementById("frameSlider");
    if (slider) slider.value = current;
    render();
  }

  window.groupRiskJump = function(epId) {
    jumpToGroupEpisode(epId);
  };

  window.groupRiskNext = function() {
    for (let i = current + 1; i < DATA.frames.length; i++) {
      const eps = getFrameGroupEpisodes(DATA.frames[i]).filter(groupEpisodeMatchesSelected);
      if (eps.length) {
        current = i;
        const slider = document.getElementById("frameSlider");
        if (slider) slider.value = current;
        render();
        return;
      }
    }

    for (let i = 0; i <= current; i++) {
      const eps = getFrameGroupEpisodes(DATA.frames[i]).filter(groupEpisodeMatchesSelected);
      if (eps.length) {
        current = i;
        const slider = document.getElementById("frameSlider");
        if (slider) slider.value = current;
        render();
        return;
      }
    }
  };

  function ensureGroupPanel() {
    let panel = document.getElementById("groupCrossingPanel");
    if (panel) return panel;

    panel = document.createElement("div");
    panel.id = "groupCrossingPanel";
    panel.style.position = "fixed";
    panel.style.left = "calc(47vw + 14px)";
    panel.style.bottom = "18px";
    panel.style.width = "480px";
    panel.style.maxHeight = "245px";
    panel.style.overflowY = "auto";
    panel.style.background = "#fefcf9";
    panel.style.color = "#2c2418";
    panel.style.border = "1px solid #e0d8cc";
    panel.style.borderRadius = "12px";
    panel.style.padding = "12px";
    panel.style.fontFamily = "'Inter', Segoe UI, sans-serif";
    panel.style.fontSize = "14px";
    panel.style.zIndex = "9999";
    panel.style.boxShadow = "0 4px 20px rgba(44,36,24,0.12)";
    document.body.appendChild(panel);
    return panel;
  }

  function updateGroupCrossingPanel() {
    const panel = ensureGroupPanel();
    const frame = DATA.frames[current];
    const active = getFrameGroupEpisodes(frame).filter(groupEpisodeMatchesSelected);

    let html = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-weight:bold;font-size:16px;font-family:'Lora',serif;">Crossing Group Risk</div>
        <button onclick="groupRiskNext()" style="cursor:pointer;padding:4px 8px;border-radius:6px;border:none;background:#2c2418;color:#faf7f2;font-family:'Inter',sans-serif;font-weight:600;">Next group risk</button>
      </div>
      <div style="color:#8a7f72;margin-bottom:8px;font-size:12px;">
        total group risk episodes: ${DATA.group_crossing_episodes.length} | active now: ${active.length}
      </div>
    `;

    if (!active.length) {
      html += `<div style="color:#8a7f72;font-size:12px;">No active crossing-group risk in this frame.</div>`;
    } else {
      active.forEach(ep => {
        const color = groupRiskColor(ep.severity);
        html += `
          <div style="border-left:5px solid ${color};padding:7px 8px;margin:7px 0;background:rgba(44,36,24,0.04);border-radius:8px;border:1px solid #e0d8cc;">
            <div style="font-weight:bold;color:${color};">${ep.severity} · CROSSING GROUP VEHICLE RISK</div>
            <div>Vehicle T${ep.vehicle_track_id} ↔ group [${ep.group_track_ids.join(", ")}]</div>
            <div>frames ${ep.start_frame_idx}-${ep.end_frame_idx} | risk distance ${Number(ep.risk_distance_m).toFixed(1)}m</div>
            <button onclick="groupRiskJump('${ep.episode_id}')" style="margin-top:5px;cursor:pointer;padding:3px 7px;border-radius:6px;border:none;background:#2c2418;color:#faf7f2;font-family:'Inter',sans-serif;font-size:11px;">Jump to start</button>
          </div>
        `;
      });
    }

    panel.innerHTML = html;
  }

  updateGroupCrossingPanel();
  console.log("Group crossing risk overlay enabled.");
  })();

})();
</script>
